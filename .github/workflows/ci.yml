name: CI

# Type-check, build and pack every package on each pull request and push to main.
# Publishing stays in release.yml, triggered by a version tag.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Build first: express type-checks against the workspace backend package's built declarations.
      - run: npm run build

      - run: npm run check

      - name: Pack (dry run)
        run: npm pack --workspaces --dry-run
